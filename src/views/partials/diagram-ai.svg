<svg class="ai__diagram" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="ai-diagram-title" xmlns="http://www.w3.org/2000/svg">
  <title id="ai-diagram-title">Agent loop: plan, call tools, evaluate, remember</title>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g class="ai__edges" fill="none" stroke="currentColor" stroke-width="1.25">
    <path class="ai__edge" id="ai-e1" d="M164,110 H236" marker-end="url(#ai-arrow)"/>
    <path class="ai__edge" id="ai-e2" d="M404,110 H476" marker-end="url(#ai-arrow)"/>
    <path class="ai__edge ai__edge--loop" id="ai-e3" d="M560,150 V206 H80 V150" marker-end="url(#ai-arrow)"/>
    <path class="ai__edge ai__edge--dim" d="M320,70 V38" marker-end="url(#ai-arrow)"/>
  </g>
  <g class="ai__nodes" fill="none" stroke="currentColor" stroke-width="1.25">
    <g class="ai__node" style="--d:0s">
      <rect x="0" y="70" width="164" height="80" rx="6"/>
      <text x="16" y="100" class="ai__label">agent</text>
      <text x="16" y="124" class="ai__meta">plan · decide</text>
    </g>
    <g class="ai__node" style="--d:1.1s">
      <rect x="236" y="70" width="168" height="80" rx="6"/>
      <text x="252" y="100" class="ai__label">tools</text>
      <text x="252" y="124" class="ai__meta">search · exec · fetch</text>
    </g>
    <g class="ai__node" style="--d:2.2s">
      <rect x="476" y="70" width="164" height="80" rx="6"/>
      <text x="492" y="100" class="ai__label">eval</text>
      <text x="492" y="124" class="ai__meta">score · retry</text>
    </g>
    <g class="ai__node ai__node--soft" style="--d:3.3s">
      <rect x="0" y="182" width="640" height="48" rx="6" stroke-dasharray="3 5"/>
      <text x="16" y="212" class="ai__meta">memory · context · traces</text>
    </g>
    <text x="320" y="26" class="ai__meta" text-anchor="middle">human in the loop</text>
  </g>
  <circle class="ai__cursor" r="4" fill="currentColor"/>
</svg>
